
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense - Personal Expense Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='add_expense.css') }}">
</head>

<body>

    <!-- Main Content -->
    <main class="expense-main">

        <!-- Page Header -->
        <header class="expense-page-header">

            <div>
                <p class="expense-eyebrow">YOUR FINANCIAL SPACE</p>
                <h1>Add Expense</h1>
                <p class="expense-subtitle">
                    Record your spending and keep track of your money.
                </p>
            </div>

            <a href="/" class="expense-back-link">
                ← Back to Dashboard
            </a>

        </header>

        <!-- Expense Form -->
        <section class="expense-form-container">

            <div class="expense-form-heading">
                <span class="expense-heading-icon">−</span>
                <h2>Expense Details</h2>
                <p>Enter your expense details below.</p>
            </div>

            <form action="{{ url_for('add_expense') }}" method="POST">

                <div class="form-group">
                    <label for="title">Expense Title <span>*</span></label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="e.g. Grocery shopping"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹) <span>*</span></label>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Enter expense amount"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category <span>*</span></label>
                    <select id="category" name="category" required>
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expense_date">Expense Date <span>*</span></label>
                    <input
                        type="date"
                        id="expense_date"
                        name="expense_date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">
                        Description <span>(Optional)</span>
                    </label>
                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Enter additional details about this expense"
                    ></textarea>
                </div>

                <div class="form-actions">

                    <a href="/" class="cancel-button">Cancel</a>

                    <button type="submit" class="save-expense-button">
                        Save Expense
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
