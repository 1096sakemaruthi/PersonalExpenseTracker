
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Income | ExpenseTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='add_income.css') }}">
</head>

<body>

    <main class="income-page">

        <header class="top-header">
            <div>
                <p class="welcome-label">YOUR FINANCIAL SPACE</p>

                <h1>Add Income</h1>

                <p class="header-subtitle">
                    Record your income and keep track of your money.
                </p>
            </div>

            <a href="{{ url_for('index') }}" class="income-back-link">
                ← Back to Dashboard
            </a>
        </header>

        <section class="form-container income-form">

            <div class="income-form-heading">
                <span class="income-form-icon">↗</span>

                <div>
                    <h2>Income Details</h2>
                    <p>Enter the details of your income below.</p>
                </div>
            </div>

            <form action="{{ url_for('add_income') }}" method="POST">

                <div class="form-group">
                    <label for="title">Income Title</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="e.g. Monthly Salary"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="source">Income Source</label>

                    <input
                        type="text"
                        id="source"
                        name="source"
                        placeholder="e.g. Company, Freelancing"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Enter income amount"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="income_date">Income Date</label>

                    <input
                        type="date"
                        id="income_date"
                        name="income_date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">
                        Description (Optional)
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Enter additional details"
                    ></textarea>
                </div>

                <div class="income-form-actions">

                    <a href="{{ url_for('index') }}"
                       class="income-cancel-button">
                        Cancel
                    </a>

                    <button type="submit" class="submit-button">
                        Save Income
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
