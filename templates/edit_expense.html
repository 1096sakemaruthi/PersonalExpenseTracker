
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense | Personal Expense Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='edit_expense.css') }}">
</head>

<body>

    <main class="edit-page">

        <section class="edit-card">

            <div class="edit-heading">
                <p class="section-eyebrow">EXPENSE MANAGEMENT</p>
                <h1>Edit Expense</h1>
                <p class="edit-subtitle">
                    Update your expense details below.
                </p>
            </div>

            {% if error %}
                <div class="message error">{{ error }}</div>
            {% endif %}

            <form method="POST"
                  action="{{ url_for('edit_expense', expense_id=expense.id) }}">

                <div class="form-group">
                    <label for="title">Expense Title *</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ expense.title }}"
                        maxlength="100"
                        required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹) *</label>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        value="{{ expense.amount }}"
                        min="0.01"
                        step="0.01"
                        required>
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        value="{{ expense.category }}"
                        maxlength="100"
                        required>
                </div>

                <div class="form-group">
                    <label for="expense_date">Expense Date *</label>
                    <input
                        type="date"
                        id="expense_date"
                        name="expense_date"
                        value="{{ expense.expense_date.strftime('%Y-%m-%d') if expense.expense_date.strftime is defined else expense.expense_date }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description">{{ expense.description or '' }}</textarea>
                </div>

                <div class="edit-actions">

                    <button type="submit" class="submit-button">
                        Save Changes
                    </button>

                    <a href="/" class="cancel-button">
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
